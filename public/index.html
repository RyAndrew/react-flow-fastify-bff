                                                        onChange={e => handleWorkflowUserChange(e.target.value)}>
                                                        <option value="">— select a user —</option>
                                                        {workflowUsers.map(u => (
                                                            <option key={u.okta_id} value={u.okta_id}>
                                                                {u.first_name} {u.last_name} ({u.email})
                                                            </option>
                                                        ))}
                                                    </select>
                                                )}
                                                {lookupLoading && (
                                                    <div className="text-muted small mt-1">
                                                        <span className="spinner-border spinner-border-sm me-1" />
                                                        Looking up SCIM ID…
                                                    </div>
                                                )}
                                                {lookupError && <div className="text-warning small mt-1">⚠ {lookupError}</div>}
                                                {idInput && !lookupLoading && (
                                                    <div className="text-success small mt-1">&#10003; SCIM ID: <code>{idInput}</code></div>
                                                )}
                                            </div>
                                        )}

                                        {/* Manual ID input */}
                                        {needsId && (
                                            <div className="mb-3">
                                                <label className="form-label small fw-bold">Resource ID{presetActive ? ' (auto-filled above)' : ''}:</label>
                                                <input type="text" className="form-control form-control-sm font-monospace"
                                                    placeholder="e.g. a3bf7e5a-1234-..."
                                                    value={idInput} onChange={e => setIdInput(e.target.value)} />
                                            </div>
                                        )}

                                        {/* Filter / pagination for list */}
                                        {needsFilter && (
                                            <div className="mb-3">
                                                <label className="form-label small fw-bold">Filter <span className="text-muted fw-normal">(SCIM filter, optional)</span>:</label>
                                                <input type="text" className="form-control form-control-sm font-monospace mb-2"
                                                    placeholder={`userName eq "john@example.com"`}
                                                    value={filterInput} onChange={e => setFilterInput(e.target.value)} />
                                                <div className="row g-2">
                                                    <div className="col">
                                                        <label className="form-label small">startIndex</label>
                                                        <input type="number" className="form-control form-control-sm" value={startIndex} onChange={e => setStartIndex(e.target.value)} />
                                                    </div>
                                                    <div className="col">
                                                        <label className="form-label small">count</label>
                                                        <input type="number" className="form-control form-control-sm" value={count} onChange={e => setCount(e.target.value)} />
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Payload editor */}
                                        {needsPayload && (
                                            <div className="mb-3">
                                                <label className="form-label small fw-bold">Request Body:</label>
                                                <textarea className="form-control font-monospace" rows={10} style={{ fontSize: '0.8rem' }}
                                                    value={payload} onChange={e => setPayload(e.target.value)} />
                                            </div>
                                        )}

                                        {/* Set Password inputs (body is built from these, never shown in plaintext) */}
                                        {isSetPassword && (
                                            <div className="mb-3">
                                                <label className="form-label small fw-bold">New Password:</label>
                                                <div className="input-group input-group-sm mb-2">
                                                    <input type={showPassword ? 'text' : 'password'} className="form-control font-monospace"
                                                        autoComplete="new-password"
                                                        value={newPassword} onChange={e => setNewPassword(e.target.value)} />
                                                    <button className="btn btn-outline-secondary" type="button" onClick={() => setShowPassword(s => !s)}>
                                                        {showPassword ? 'Hide' : 'Show'}
                                                    </button>
                                                    <button className="btn btn-outline-secondary" type="button" onClick={handleGeneratePassword}>
                                                        Generate
                                                    </button>
                                                </div>
                                                <label className="form-label small fw-bold">Confirm Password:</label>
                                                <input type={showPassword ? 'text' : 'password'} className="form-control form-control-sm font-monospace mb-1"
                                                    autoComplete="new-password"
                                                    value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} />
                                                {confirmPassword && newPassword !== confirmPassword && (
                                                    <div className="text-warning small mb-1">⚠ Passwords do not match</div>
                                                )}
                                                <label className="form-label small fw-bold mt-2">Request Body <span className="text-muted fw-normal">(preview, password masked)</span>:</label>
                                                <pre className="json-pre mb-0" style={{ fontSize: '0.8rem' }}>
                                                    {fmtJson(buildScimPasswordPatch(newPassword ? '••••••••' : ''))}
                                                </pre>
                                            </div>
                                        )}

                                        <button className={`btn btn-${SCIM_ACTION_COLORS[action]}`}
                                            onClick={handleExecute}
                                            disabled={loading || !serverId}>
                                            {loading && <span className="spinner-border spinner-border-sm me-2" />}
                                            {loading ? 'Sending…' : `Execute ${SCIM_ACTION_LABELS[action]}`}
                                        </button>
                                        {!serverId && <span className="text-muted small ms-2">Select a server first</span>}
                                    </div>

                                    {/* ── Right: response ── */}
                                    <div className="col-md-7">
                                        <div className="d-flex align-items-center mb-2 gap-2">
                                            <span className="fw-bold small">Response</span>
                                            {httpStatus && <span className={`badge ${statusBadgeClass}`}>{httpStatus}</span>}
                                            {(response !== null || error) && (
                                                <button className="btn btn-outline-secondary btn-sm ms-auto" onClick={resetResult}>Clear</button>
                                            )}
                                        </div>
                                        {loading && <div className="text-center py-4"><div className="spinner-border text-primary" /></div>}
                                        {!loading && response !== null && (
                                            <div>
                                                <div className="text-success fw-bold small mb-1">&#10003; Success</div>
                                                <pre className="json-pre" style={{ maxHeight: '65vh' }}>{fmtJson(response)}</pre>
                                            </div>
                                        )}
                                        {!loading && error && (
                                            <div>
                                                <div className="text-danger fw-bold small mb-1">&#10007; Error</div>
                                                <pre className="json-pre text-danger" style={{ maxHeight: '65vh' }}>{error}</pre>
                                            </div>
                                        )}
                                        {!loading && response === null && !error && (
                                            <div className="text-center text-muted py-5">
                                                <p className="mb-1">No response yet.</p>
                                                <p className="small">Configure a request on the left and click Execute.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ─── Custom Node Component ─────────────────────────────────────────

        const CustomNode = ({ data, id }) => (
            <>
                <Handle type="target" position={Position.Top} />
                <NodeToolbar position="top">
                    <button className="btn btn-sm btn-success me-2" onClick={() => data.onRun(id)}>▶ Run</button>
                    <button className="btn btn-sm btn-primary me-2" onClick={() => data.onViewLogs(id)}>📄 View Logs</button>
                    <button className="btn btn-sm btn-outline-info" onClick={() => data.onScimNavigate(id)}>↗ SCIM</button>
                </NodeToolbar>
                <div>{data.label}</div>
                <Handle type="source" position={Position.Bottom} />
            </>
        );

        const nodeTypes = { custom: CustomNode };

        // ─── Initial Edges ─────────────────────────────────────────────────

        const initialEdges = [
            { id: 'e1-2', source: '1', target: '2', markerEnd: { type: MarkerType.ArrowClosed } },
            { id: 'e2-3', source: '2', target: '3', markerEnd: { type: MarkerType.ArrowClosed } },
            { id: 'e3-4', source: '3', target: '4', markerEnd: { type: MarkerType.ArrowClosed } },
        ];

        // ─── Modal type → title + content mapping ──────────────────────────

        const MODAL_CONFIG = {
            create:         { title: 'Create User',               size: 'modal-lg', Content: CreateUserContent },
            update:         { title: 'Update User',               size: 'modal-lg', Content: UpdateUserContent },
            lifecycle:      { title: 'User Lifecycle',            size: 'modal-lg', Content: LifecycleContent },
            delete:         { title: 'Deactivate / Delete User',  size: '',         Content: DeleteContent },
            logs_create:    { title: 'Logs: Create User',         size: 'modal-xl', Content: LogsContentCreate },
            logs_update:    { title: 'Logs: Update User',         size: 'modal-xl', Content: LogsContentUpdate },
            logs_lifecycle: { title: 'Logs: Lifecycle',           size: 'modal-xl', Content: LogsContentLifecycle },
            logs_delete:    { title: 'Logs: Deactivate / Delete', size: 'modal-xl', Content: LogsContentDelete },
        };

        const NODE_TO_MODAL = { '1': 'create', '2': 'update', '3': 'lifecycle', '4': 'delete' };
        const NODE_TO_LOGS  = { '1': 'logs_create', '2': 'logs_update', '3': 'logs_lifecycle', '4': 'logs_delete' };

        // Workflow node → SCIM preset mapping
        const NODE_SCIM_PRESETS = {
            '1': { resourceType: 'Users', action: 'create', requiresUser: false },
            '2': { resourceType: 'Users', action: 'patch',  requiresUser: true },
            '3': { resourceType: 'Users', action: 'patch',  requiresUser: true, patchOps: [{ op: 'replace', path: 'active', value: false }] },
            '4': { resourceType: 'Users', action: 'delete', requiresUser: true },
        };

        // ─── Main App ──────────────────────────────────────────────────────

        const App = () => {
            const { isAuthenticated, isLoading, user, logout, refresh, loginRedirect, showExpiry, loggedOut, countdown } = useAuth();
            const [view, setView] = useState('workflow'); // 'workflow' | 'scim'
            const [modalType, setModalType] = useState(null);
            const [scimPreset, setScimPreset] = useState(null);
            const [selectedScimServerId, setSelectedScimServerId] = useState('');
            const [authError] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                const err = params.get('error');
                if (err) history.replaceState(null, '', window.location.pathname);
                return err || null;
            });

            const closeModal = useCallback(() => setModalType(null), []);

            const handleRun = useCallback((nodeId) => {
                setModalType(NODE_TO_MODAL[nodeId] || null);
            }, []);

            const handleViewLogs = useCallback((nodeId) => {
                setModalType(NODE_TO_LOGS[nodeId] || 'logs_create');
            }, []);

            const handleScimNavigate = useCallback((nodeId) => {
                setScimPreset(NODE_SCIM_PRESETS[nodeId] || null);
                setView('scim');
            }, []);

            const initialNodes = [
                { id: '1', type: 'custom', data: { label: '1. Create User',  onRun: handleRun, onViewLogs: handleViewLogs, onScimNavigate: handleScimNavigate }, position: { x: 250, y: 50 },  className: 'create' },
                { id: '2', type: 'custom', data: { label: '2. Update User',  onRun: handleRun, onViewLogs: handleViewLogs, onScimNavigate: handleScimNavigate }, position: { x: 250, y: 150 }, className: 'update' },
                { id: '3', type: 'custom', data: { label: '3. Suspend User', onRun: handleRun, onViewLogs: handleViewLogs, onScimNavigate: handleScimNavigate }, position: { x: 250, y: 250 }, className: 'suspend' },
                { id: '4', type: 'custom', data: { label: '4. Delete User',  onRun: handleRun, onViewLogs: handleViewLogs, onScimNavigate: handleScimNavigate }, position: { x: 250, y: 350 }, className: 'delete' },
            ];

            const [nodes, setNodes] = useState(initialNodes);
            const [edges, setEdges] = useState(initialEdges);
            const onNodesChange = useCallback((c) => setNodes(n => applyNodeChanges(c, n)), []);
            const onEdgesChange = useCallback((c) => setEdges(e => applyEdgeChanges(c, e)), []);

            if (isLoading) return <LoadingScreen />;

            if (authError) return (
                <div className="loading-screen">
                    <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
                        <div className="modal-dialog modal-dialog-centered">
                            <div className="modal-content border-danger">
                                <div className="modal-header bg-danger text-white">
                                    <h5 className="modal-title">Authentication Error</h5>
                                </div>
                                <div className="modal-body">
                                    <p className="mb-0">{authError}</p>
                                </div>
                                <div className="modal-footer justify-content-center">
                                    <button className="btn btn-primary btn-lg" onClick={loginRedirect}>Try Again</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            if (loggedOut || !isAuthenticated) return (
                <div className="loading-screen">
                    <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
                        <div className="modal-dialog modal-dialog-centered">
                            <div className="modal-content border-danger">
                                <div className="modal-header bg-danger text-white">
                                    <h5 className="modal-title">Session Expired</h5>
                                </div>
                                <div className="modal-body text-center">
                                    <p className="mb-1">Your session has expired due to inactivity.</p>
                                    <p className="text-muted small mb-0">Please log in again to continue.</p>
                                </div>
                                <div className="modal-footer justify-content-center">
                                    <button className="btn btn-primary btn-lg" onClick={loginRedirect}>Log In</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const cfg = modalType ? MODAL_CONFIG[modalType] : null;

            return (
                <div className="container-fluid h-100 p-0">
                    <nav className="navbar navbar-dark bg-dark">
                        <div className="container-fluid">
                            <span className="navbar-brand mb-0 h1">User Management Process Flow</span>
                            <div className="d-flex align-items-center gap-2">
                                <button className={`btn btn-sm ${view === 'workflow' ? 'btn-light' : 'btn-outline-light'}`} onClick={() => setView('workflow')}>Workflow</button>
                                <button className={`btn btn-sm ${view === 'scim' ? 'btn-light' : 'btn-outline-light'}`} onClick={() => setView('scim')}>SCIM Client</button>
                                <span className="text-light ms-2">{user?.name}</span>
                                <button className="btn btn-outline-light btn-sm" onClick={logout}>Logout</button>
                            </div>
                        </div>
                    </nav>
                    {view === 'workflow' ? (
                        <div style={{ height: 'calc(100vh - 56px)' }}>
                            <ReactFlowComponent nodes={nodes} edges={edges} onNodesChange={onNodesChange} onEdgesChange={onEdgesChange} nodeTypes={nodeTypes} fitView>
                                <Controls />
                                <Background variant="dots" gap={12} size={1} />
                            </ReactFlowComponent>
                        </div>
                    ) : (
                        <ScimClient
                            preset={scimPreset}
                            onClearPreset={() => setScimPreset(null)}
                            serverId={selectedScimServerId}
                            onServerIdChange={setSelectedScimServerId}
                        />
                    )}
                    {cfg && (
                        <Modal show={true} onClose={closeModal} title={cfg.title} size={cfg.size}>
                            <cfg.Content onClose={closeModal} />
                        </Modal>
                    )}
                    {showExpiry && (
                        <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)', zIndex: 2000 }}>
                            <div className="modal-dialog modal-dialog-centered">
                                <div className="modal-content border-warning">
                                    <div className="modal-header bg-warning">
                                        <h5 className="modal-title">Session Expiring</h5>
                                    </div>
                                    <div className="modal-body text-center">
                                        <p className="mb-1">Your session will expire in</p>
                                        <h2 className="text-danger fw-bold">{Math.floor(countdown / 60)}:{String(countdown % 60).padStart(2, '0')}</h2>
                                        <p className="text-muted small mb-0">Click below to stay signed in, or you will be logged out automatically.</p>
                                    </div>
                                    <div className="modal-footer justify-content-center">
                                        <button className="btn btn-success btn-lg" onClick={refresh}>Stay Signed In</button>
                                        <button className="btn btn-outline-secondary" onClick={logout}>Logout Now</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ─── Render ────────────────────────────────────────────────────────

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <SessionAuthProvider>
                <App />
            </SessionAuthProvider>
        );
    </script>
</body>
</html>
