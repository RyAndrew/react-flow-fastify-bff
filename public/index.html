<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Process</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .loading-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #f8f9fa; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/style.css" integrity="sha384-WfpZHO7r6MmU1PGSq0L/LisTEQ/XCapo6UtOSxiNTeJ9CavXCyX5eNZ9jPLnk4+P" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/workflow.css">
    <link rel="stylesheet" href="styles/LogViewer.css">
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div class="text-center">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <div class="text-muted">Loading...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.1/babel.min.js" integrity="sha384-Fo0OdKhdnE7y2WmzjOMW4PYjHkkANeu1501pWTqKrzAPeJMFQb4ZTdAA9dtrVUJV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/umd/index.js" integrity="sha384-wY7mYYMW29ydU3pWp9gFlKSilyabWOUTm6envyQ35JUSDtrXSu36Mkqvey1Echsg" crossorigin="anonymous"></script>

    <script src="lib/util.js"></script>
    <script src="lib/scim.js"></script>
    <script src="lib/okta.js"></script>

    <script type="text/babel" src="src/auth/SessionAuthProvider.jsx"></script>
    <script type="text/babel" src="src/auth/LoadingScreen.jsx"></script>
    <script type="text/babel" src="src/auth/AuthErrorScreen.jsx"></script>
    <script type="text/babel" src="src/auth/SessionExpiredScreen.jsx"></script>
    <script type="text/babel" src="src/auth/SessionExpiryDialog.jsx"></script>

    <script type="text/babel" src="src/components/ApiError.jsx"></script>
    <script type="text/babel" src="src/components/Modal.jsx"></script>
    <script type="text/babel" src="src/components/StatusBadge.jsx"></script>
    <script type="text/babel" src="src/components/UserPicker.jsx"></script>
    <script type="text/babel" src="src/components/PayloadTask.jsx"></script>
    <script type="text/babel" src="src/components/LogViewer.jsx"></script>

    <script type="text/babel" src="src/workflow/CustomNode.jsx"></script>
    <script type="text/babel" src="src/workflow/CreateUserContent.jsx"></script>
    <script type="text/babel" src="src/workflow/ImportUserContent.jsx"></script>
    <script type="text/babel" src="src/workflow/ReadUsersContent.jsx"></script>
    <script type="text/babel" src="src/workflow/EnrollFactorContent.jsx"></script>
    <script type="text/babel" src="src/workflow/AddToGroupContent.jsx"></script>
    <script type="text/babel" src="src/workflow/UpdateUserContent.jsx"></script>
    <script type="text/babel" src="src/workflow/LifecycleContent.jsx"></script>
    <script type="text/babel" src="src/workflow/DeleteContent.jsx"></script>
    <script type="text/babel" src="src/workflow/LogsContent.jsx"></script>

    <script type="text/babel" src="src/scim/ScimServerManager.jsx"></script>
    <script type="text/babel" src="src/scim/ScimUserResults.jsx"></script>
    <script type="text/babel" src="src/scim/ScimClient.jsx"></script>

    <script type="text/babel" src="src/App.jsx"></script>
    <script type="text/babel" src="src/config.js"></script>

    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <SessionAuthProvider>
                <App />
            </SessionAuthProvider>
        );
    </script>
</body>
</html>
